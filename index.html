<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Survival - Hardcore</title>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas { display: block; }

#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    text-align: center;
    line-height: 70px;
}

#bucket {
    position: fixed;
    left: 20px;
    bottom: 110px;
    width: 55px;
    height: 55px;
    background: #444;
    border-radius: 10px;
}
.full { background: cyan !important; }

#shieldBtn {
    position: fixed;
    right: 20px;
    bottom: 40px;
    width: 80px;
    height: 80px;
    background: #333;
    border-radius: 50%;
    text-align: center;
    line-height: 80px;
}

.active { background: cyan !important; }

#points {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 36px;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="well">💧</div>
<div id="bucket"></div>
<div id="shieldBtn">HOLD</div>
<div id="points">0</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("plantGame")) || {
    growth: 0,
    points: 0
};

function save(){
    localStorage.setItem("plantGame", JSON.stringify(data));
}

// ===== BUCKET =====
let bucket = document.getElementById("bucket");
let isFull = false;

document.getElementById("well").onclick = ()=>{
    isFull = true;
    bucket.classList.add("full");
};

bucket.draggable = true;

bucket.addEventListener("dragend", e=>{
    let plantX = canvas.width/2;

    if(Math.abs(e.clientX-plantX)<120 && isFull){
        data.growth += 0.0008;
        data.points += 1;

        if(data.growth > 1) data.growth = 1;

        save();

        isFull = false;
        bucket.classList.remove("full");
    }
});

// ===== SHIELD SYSTEM =====
let shieldBtn = document.getElementById("shieldBtn");
let holding = false;

let shieldDelay = 15; // delay before active
let shieldTimer = 0;

let shieldEnergy = 100;

shieldBtn.addEventListener("mousedown", ()=> holding = true);
shieldBtn.addEventListener("mouseup", ()=> holding = false);
shieldBtn.addEventListener("touchstart", ()=> holding = true);
shieldBtn.addEventListener("touchend", ()=> holding = false);

// ===== CYCLONE =====
let cyclone = false;
let cycloneTimer = 0;

function triggerCyclone(){
    cyclone = true;
    cycloneTimer = 0;
}

// RANDOM SUDDEN ATTACK
setInterval(()=>{
    if(Math.random() < 0.25){
        triggerCyclone();
    }
}, 6000);

// ===== UPDATE =====
function updateShield(){

    if(holding){
        shieldTimer++;
        shieldEnergy -= 1.2;
    } else {
        shieldTimer = 0;
        shieldEnergy += 0.6;
    }

    if(shieldEnergy > 100) shieldEnergy = 100;
    if(shieldEnergy < 0) shieldEnergy = 0;

    // active only if held long enough
    return holding && shieldTimer > shieldDelay && shieldEnergy > 10;
}

function updateCyclone(){

    if(!cyclone) return;

    cycloneTimer++;

    let activeShield = updateShield();

    if(!activeShield){
        // INSTANT STRONG DAMAGE
        data.growth -= 0.04;
    } else {
        // still small damage
        data.growth -= 0.002;
    }

    if(data.growth < 0) data.growth = 0;

    if(cycloneTimer > 120){
        cyclone = false;
    }
}

// ===== DRAW =====
function drawPlant(){

    let x = canvas.width/2;
    let y = canvas.height-80;

    let h = data.growth * 420;

    ctx.strokeStyle = cyclone ? "red" : "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(let i=0;i<h;i+=5){
        let sway = Math.sin(i*0.05 + Date.now()*0.004)*10;
        if(cyclone) sway *= 6;
        ctx.lineTo(x+sway, y-i);
    }
    ctx.stroke();
}

// ===== LOOP =====
function loop(){

    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawPlant();
    updateCyclone();

    document.getElementById("points").innerText = data.points;

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
