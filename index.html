<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Survival</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #0a0a0a, #000);
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas { display: block; }

/* WELL */
#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    text-align: center;
    line-height: 70px;
    font-size: 22px;
}

/* BUCKET */
#bucket {
    position: fixed;
    left: 20px;
    bottom: 110px;
    width: 55px;
    height: 55px;
    background: #444;
    border-radius: 10px;
    cursor: grab;
}
.full { background: cyan !important; }

/* POINTS */
#points {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 38px;
    font-weight: bold;
}

/* ALERT */
#alert {
    position: fixed;
    top: 35%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    display: none;
    color: red;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="well">💧</div>
<div id="bucket"></div>
<div id="points">0</div>
<div id="alert">🌪️ BUILD SHIELD!</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("plantGame")) || {
    growth: 0,
    points: 0
};

function save(){
    localStorage.setItem("plantGame", JSON.stringify(data));
}

// ===== BUCKET SYSTEM =====
let bucket = document.getElementById("bucket");
let isFull = false;

document.getElementById("well").onclick = ()=>{
    isFull = true;
    bucket.classList.add("full");
};

bucket.draggable = true;

bucket.addEventListener("dragend", e=>{
    let plantX = canvas.width/2;

    if(Math.abs(e.clientX-plantX)<120 && isFull){
        data.growth += 0.001;
        data.points += 1;

        if(data.growth > 1) data.growth = 1;

        reaction = 25;

        save();

        isFull = false;
        bucket.classList.remove("full");
    }
});

// ===== RAIN =====
let raining = false;
let rainDrops = [];

setInterval(()=>{
    raining = Math.random() < 0.3;
}, 7000);

function drawRain(){
    if(raining){
        rainDrops.push({
            x: Math.random()*canvas.width,
            y: 0,
            speed: 5 + Math.random()*5
        });
    }

    rainDrops.forEach((r,i)=>{
        ctx.fillStyle = "cyan";
        ctx.fillRect(r.x, r.y, 2, 12);
        r.y += r.speed;

        if(r.y > canvas.height-100){
            data.growth += 0.0003;
            if(data.growth > 1) data.growth = 1;
            rainDrops.splice(i,1);
        }
    });
}

// ===== CYCLONE + SHIELD =====
let cyclone = false;
let cycloneTimer = 0;

let shieldPower = 0;
let maxShield = 100;

// start cyclone randomly
setInterval(()=>{
    if(!cyclone && Math.random() < 0.2){
        cyclone = true;
        cycloneTimer = 0;
        shieldPower = 0;
        document.getElementById("alert").style.display = "block";
    }
}, 10000);

// tapping builds shield
canvas.addEventListener("click", ()=>{
    if(cyclone){
        shieldPower += 10;
        if(shieldPower > maxShield) shieldPower = maxShield;
    }
});

// cyclone logic
function updateCyclone(){
    if(!cyclone) return;

    cycloneTimer++;

    // shield drains constantly
    shieldPower -= 1.2;
    if(shieldPower < 0) shieldPower = 0;

    // if weak shield → damage
    if(shieldPower < 40){
        data.growth -= 0.006;
    }

    if(data.growth < 0) data.growth = 0;

    // end cyclone
    if(cycloneTimer > 240){
        cyclone = false;
        document.getElementById("alert").style.display = "none";
        shieldPower = 0;
    }
}

// ===== PLANT DRAW =====
let reaction = 0;

function drawPlant(){
    let x = canvas.width/2;
    let y = canvas.height-80;

    let h = data.growth * 420;

    ctx.strokeStyle = cyclone ? "red" : "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(let i=0;i<h;i+=5){
        let sway = Math.sin(i*0.05 + Date.now()*0.003)*10;
        if(cyclone) sway *= 4;
        ctx.lineTo(x+sway, y-i);
    }
    ctx.stroke();

    // leaves
    for(let i=60;i<h;i+=70){
        ctx.fillStyle="green";
        ctx.beginPath();
        ctx.ellipse(x+20,y-i,10,5,0,0,Math.PI*2);
        ctx.fill();
    }

    // glow reaction
    if(reaction>0){
        ctx.fillStyle="rgba(0,255,0,0.2)";
        ctx.beginPath();
        ctx.arc(x,y-h,45,0,Math.PI*2);
        ctx.fill();
        reaction--;
    }

    if(data.growth >= 1) drawFruits(x,y-h);
}

// ===== SHIELD BAR =====
function drawShield(){
    if(!cyclone) return;

    ctx.fillStyle = "#333";
    ctx.fillRect(20, 20, 200, 12);

    ctx.fillStyle = "cyan";
    ctx.fillRect(20, 20, shieldPower * 2, 12);
}

// ===== FRUITS =====
let secretFruit = Math.floor(Math.random()*5);
let fruits = [];

function drawFruits(x,y){
    fruits = [];

    for(let i=0;i<5;i++){
        let fx = x + Math.cos(i*1.2)*60;
        let fy = y - Math.sin(i*1.2)*40;

        fruits.push({x:fx,y:fy,i});

        ctx.fillStyle="red";
        ctx.beginPath();
        ctx.arc(fx,fy,12,0,Math.PI*2);
        ctx.fill();
    }
}

// click detection
canvas.addEventListener("click", e=>{
    if(data.growth < 1) return;

    fruits.forEach(f=>{
        let dx = e.clientX - f.x;
        let dy = e.clientY - f.y;

        if(Math.sqrt(dx*dx+dy*dy) < 15){
            if(f.i === secretFruit){
                window.location.href = "secret.html";
            } else {
                alert("Nothing here...");
            }
        }
    });
});

// ===== LOOP =====
function loop(){
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawPlant();
    drawRain();
    updateCyclone();
    drawShield();

    document.getElementById("points").innerText = data.points;

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
