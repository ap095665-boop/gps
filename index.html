<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Survival - Hard Mode</title>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas { display: block; }

#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    text-align: center;
    line-height: 70px;
}

#bucket {
    position: fixed;
    left: 20px;
    bottom: 110px;
    width: 55px;
    height: 55px;
    background: #444;
    border-radius: 10px;
}
.full { background: cyan !important; }

#points {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 36px;
}

#alert {
    position: fixed;
    top: 40%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    display: none;
    color: red;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="well">💧</div>
<div id="bucket"></div>
<div id="points">0</div>
<div id="alert">🌪️ TAP FAST OR DIE</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("plantGame")) || {
    growth: 0,
    points: 0
};

function save(){
    localStorage.setItem("plantGame", JSON.stringify(data));
}

// ===== BUCKET =====
let bucket = document.getElementById("bucket");
let isFull = false;

document.getElementById("well").onclick = ()=>{
    isFull = true;
    bucket.classList.add("full");
};

bucket.draggable = true;

bucket.addEventListener("dragend", e=>{
    let plantX = canvas.width/2;

    if(Math.abs(e.clientX-plantX)<120 && isFull){
        data.growth += 0.0008;
        data.points += 1;

        if(data.growth > 1) data.growth = 1;

        reaction = 20;

        save();

        isFull = false;
        bucket.classList.remove("full");
    }
});

// ===== RAIN =====
let raining = false;
setInterval(()=>{
    raining = Math.random()<0.25;
}, 8000);

let rainDrops=[];

function drawRain(){
    if(raining){
        rainDrops.push({
            x: Math.random()*canvas.width,
            y:0,
            speed:6+Math.random()*5
        });
    }

    rainDrops.forEach((r,i)=>{
        ctx.fillStyle="cyan";
        ctx.fillRect(r.x,r.y,2,12);
        r.y+=r.speed;

        if(r.y>canvas.height-100){
            data.growth += 0.0002;
            if(data.growth > 1) data.growth = 1;
            rainDrops.splice(i,1);
        }
    });
}

// ===== CYCLONE (HARD MODE) =====
let cyclone = false;
let taps = 0;
let lastCheck = Date.now();
let cycloneTimer = 0;

setInterval(()=>{
    if(!cyclone && Math.random()<0.2){
        cyclone = true;
        taps = 0;
        cycloneTimer = 0;
        document.getElementById("alert").style.display="block";
    }
}, 10000);

// TAP TRACK
canvas.addEventListener("click", ()=>{
    if(cyclone){
        taps++;
    }
});

function updateCyclone(){
    if(!cyclone) return;

    cycloneTimer++;

    let now = Date.now();
    let tps = taps / ((now - lastCheck)/1000);

    // REQUIRE FAST TAPPING (>= 6 taps/sec)
    if(tps >= 6){
        // protected
    } else {
        // HEAVY DAMAGE
        data.growth -= 0.02;
    }

    // clamp
    if(data.growth < 0) data.growth = 0;

    // reset counter every second
    if(now - lastCheck > 1000){
        taps = 0;
        lastCheck = now;
    }

    // end cyclone after duration
    if(cycloneTimer > 180){
        cyclone = false;
        document.getElementById("alert").style.display="none";
    }
}

// ===== DRAW PLANT =====
let reaction = 0;

function drawPlant(){
    let x = canvas.width/2;
    let y = canvas.height-80;

    let h = data.growth * 400;

    ctx.strokeStyle = cyclone ? "red" : "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(let i=0;i<h;i+=5){
        let sway = Math.sin(i*0.05 + Date.now()*0.003)*10;
        if(cyclone) sway *= 5;
        ctx.lineTo(x+sway, y-i);
    }
    ctx.stroke();

    // leaves
    for(let i=60;i<h;i+=70){
        ctx.fillStyle="green";
        ctx.beginPath();
        ctx.ellipse(x+20,y-i,10,5,0,0,Math.PI*2);
        ctx.fill();
    }

    // glow
    if(reaction>0){
        ctx.fillStyle="rgba(0,255,0,0.2)";
        ctx.beginPath();
        ctx.arc(x,y-h,40,0,Math.PI*2);
        ctx.fill();
        reaction--;
    }

    if(data.growth >= 1) drawFruits(x,y-h);
}

// ===== FRUITS =====
let secretFruit = Math.floor(Math.random()*5);
let fruits=[];

function drawFruits(x,y){
    fruits=[];

    for(let i=0;i<5;i++){
        let fx = x + Math.cos(i*1.2)*60;
        let fy = y - Math.sin(i*1.2)*40;

        fruits.push({x:fx,y:fy,i});

        ctx.fillStyle="red";
        ctx.beginPath();
        ctx.arc(fx,fy,12,0,Math.PI*2);
        ctx.fill();
    }
}

canvas.addEventListener("click", e=>{
    if(data.growth < 1) return;

    fruits.forEach(f=>{
        let dx=e.clientX-f.x;
        let dy=e.clientY-f.y;

        if(Math.sqrt(dx*dx+dy*dy)<15){
            if(f.i===secretFruit){
                window.location.href="secret.html";
            } else {
                alert("Nothing here...");
            }
        }
    });
});

// ===== LOOP =====
function loop(){
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawPlant();
    drawRain();
    updateCyclone();

    document.getElementById("points").innerText = data.points;

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
