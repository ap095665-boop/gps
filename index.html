<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Growth Game</title>

<style>
body {
    margin: 0;
    background: #0b0b0b;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas {
    display: block;
}

/* WELL */
#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    text-align: center;
    line-height: 70px;
}

/* BUCKET */
#bucket {
    position: fixed;
    left: 20px;
    bottom: 110px;
    width: 50px;
    height: 50px;
    background: gray;
    border-radius: 10px;
    cursor: grab;
}

.full {
    background: cyan !important;
}

/* UI */
#info {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 14px;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="well">🕳️</div>
<div id="bucket"></div>

<div id="info">
🌱 Points: <span id="points">0</span><br>
📅 Day: <span id="day"></span>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===== LOAD / INIT =====
let data = JSON.parse(localStorage.getItem("plantData")) || {
    startDate: new Date().toISOString(),
    lastWaterDate: "",
    points: 0,
    bonusGrowth: 0
};

// ===== DATE =====
let today = new Date();
let todayStr = today.toDateString();

let startDate = new Date(data.startDate);
let targetDate = new Date(today.getFullYear(), 11, 25);

// ===== DAY COUNT =====
let days = Math.floor((today - startDate)/(1000*60*60*24));
document.getElementById("day").innerText = days;

// ===== GROWTH =====
let totalDays = (targetDate - startDate)/(1000*60*60*24);
let passedDays = (today - startDate)/(1000*60*60*24);

let growth = Math.min(1, (passedDays / totalDays) + data.bonusGrowth);

// ===== BUCKET STATE =====
let bucket = document.getElementById("bucket");
let isFull = false;

// ===== FILL FROM WELL =====
document.getElementById("well").onclick = () => {
    isFull = true;
    bucket.classList.add("full");
};

// ===== DRAG =====
bucket.draggable = true;

bucket.addEventListener("dragend", e => {
    let plantX = canvas.width / 2;

    if (Math.abs(e.clientX - plantX) < 120 && isFull) {

        // ONE WATER PER DAY
        if (data.lastWaterDate !== todayStr) {

            data.lastWaterDate = todayStr;
            data.points += 10;
            data.bonusGrowth += 0.02;

            reactionEffect();

            save();

        } else {
            alert("Already watered today 💧");
        }

        // EMPTY BUCKET
        isFull = false;
        bucket.classList.remove("full");
    }
});

// ===== SAVE =====
function save() {
    localStorage.setItem("plantData", JSON.stringify(data));
}

// ===== PLANT REACTION =====
let reaction = 0;

function reactionEffect() {
    reaction = 20;
}

// ===== DRAW =====
function drawPlant() {

    let baseX = canvas.width / 2;
    let baseY = canvas.height - 80;

    let height = growth * 400;

    ctx.strokeStyle = "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(baseX, baseY);

    for (let i = 0; i < height; i += 5) {
        let sway = Math.sin(i*0.05 + Date.now()*0.002) * 10;
        ctx.lineTo(baseX + sway, baseY - i);
    }

    ctx.stroke();

    // LEAVES
    for (let i = 50; i < height; i += 60) {
        ctx.fillStyle = "green";
        ctx.beginPath();
        ctx.ellipse(baseX + 20, baseY - i, 10, 5, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // REACTION GLOW
    if (reaction > 0) {
        ctx.fillStyle = "rgba(0,255,0,0.2)";
        ctx.beginPath();
        ctx.arc(baseX, baseY - height, 40, 0, Math.PI*2);
        ctx.fill();
        reaction--;
    }

    // 🎄 DEC 25 → FRUITS
    if (growth >= 1) drawFruits(baseX, baseY - height);
}

// ===== FRUITS =====
let secretFruit = 2;

function drawFruits(x, y) {
    for (let i = 0; i < 5; i++) {

        let fx = x + Math.cos(i * 1.2) * 60;
        let fy = y - Math.sin(i * 1.2) * 40;

        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(fx, fy, 12, 0, Math.PI*2);
        ctx.fill();

        // CLICK DETECTION
        canvas.onclick = e => {
            let dx = e.clientX - fx;
            let dy = e.clientY - fy;

            if (Math.sqrt(dx*dx + dy*dy) < 15) {

                if (i === secretFruit) {

                    if (data.points >= 200) {
                        window.location.href = "secret.html";
                    } else {
                        alert("Not enough points");
                    }

                } else {
                    alert("Nothing here...");
                }
            }
        };
    }
}

// ===== LOOP =====
function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawPlant();

    document.getElementById("points").innerText = data.points;

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
