<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Survival Final</title>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas { display: block; }

#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    text-align: center;
    line-height: 70px;
}

#bucket {
    position: fixed;
    left: 20px;
    bottom: 110px;
    width: 55px;
    height: 55px;
    background: #444;
    border-radius: 10px;
}
.full { background: cyan !important; }

#shieldBtn {
    position: fixed;
    right: 20px;
    bottom: 40px;
    width: 80px;
    height: 80px;
    background: #333;
    border-radius: 50%;
    text-align: center;
    line-height: 80px;
}
.active { background: cyan !important; }

#points {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 36px;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="well">💧</div>
<div id="bucket"></div>
<div id="shieldBtn">HOLD</div>
<div id="points">0</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("plantGame")) || {
    growth: 0,
    points: 0
};

function save(){
    localStorage.setItem("plantGame", JSON.stringify(data));
}

// ===== BUCKET =====
let bucket = document.getElementById("bucket");
let isFull = false;

document.getElementById("well").onclick = ()=>{
    isFull = true;
    bucket.classList.add("full");
};

bucket.draggable = true;

bucket.addEventListener("dragend", e=>{
    let plantX = canvas.width/2;

    if(Math.abs(e.clientX-plantX)<120 && isFull){
        data.growth += 0.001;
        data.points += 1;

        if(data.growth > 1) data.growth = 1;

        save();

        isFull = false;
        bucket.classList.remove("full");
    }
});

// ===== SHIELD =====
let shieldBtn = document.getElementById("shieldBtn");
let holding = false;

shieldBtn.addEventListener("mousedown", ()=> {
    holding = true;
    shieldBtn.classList.add("active");
});

shieldBtn.addEventListener("mouseup", ()=> {
    holding = false;
    shieldBtn.classList.remove("active");
});

shieldBtn.addEventListener("touchstart", ()=> {
    holding = true;
    shieldBtn.classList.add("active");
});

shieldBtn.addEventListener("touchend", ()=> {
    holding = false;
    shieldBtn.classList.remove("active");
});

// ===== RAIN SYSTEM =====
let raining = false;
let rainDrops = [];

setInterval(()=>{
    raining = Math.random() < 0.5; // more frequent
}, 5000);

function drawRain(){
    if(raining){
        rainDrops.push({
            x: Math.random()*canvas.width,
            y: 0,
            speed: 6 + Math.random()*4
        });
    }

    rainDrops.forEach((r,i)=>{
        ctx.fillStyle = "cyan";
        ctx.fillRect(r.x, r.y, 2, 12);
        r.y += r.speed;

        if(r.y > canvas.height-100){
            data.growth += 0.0005;
            if(data.growth > 1) data.growth = 1;
            rainDrops.splice(i,1);
        }
    });
}

// ===== CYCLONE (INSTANT DEATH SYSTEM) =====
let cyclone = false;
let cycloneTimer = 0;

// sudden cyclone trigger
setInterval(()=>{
    if(Math.random() < 0.25){
        cyclone = true;
        cycloneTimer = 0;

        // CHECK instantly
        if(!holding){
            // 💀 instant destruction
            data.growth = 0;
            data.points = 0;
            alert("🌪️ You were not ready.");
        }
    }
}, 6000);

// cyclone effect duration
function updateCyclone(){
    if(!cyclone) return;

    cycloneTimer++;

    if(cycloneTimer > 80){
        cyclone = false;
    }
}

// ===== DRAW =====
function drawPlant(){

    let x = canvas.width/2;
    let y = canvas.height-80;

    let h = data.growth * 420;

    ctx.strokeStyle = cyclone ? "red" : "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(let i=0;i<h;i+=5){
        let sway = Math.sin(i*0.05 + Date.now()*0.004)*10;
        if(cyclone) sway *= 6;
        ctx.lineTo(x+sway, y-i);
    }
    ctx.stroke();
}

// ===== LOOP =====
function loop(){

    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawPlant();
    drawRain();
    updateCyclone();

    document.getElementById("points").innerText = data.points;

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
