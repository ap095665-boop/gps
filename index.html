<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survival Plant</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #0a0a0a, #000);
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas { display: block; }

/* WELL */
#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    text-align: center;
    line-height: 70px;
    font-size: 22px;
}

/* BUCKET */
#bucket {
    position: fixed;
    left: 20px;
    bottom: 110px;
    width: 55px;
    height: 55px;
    background: #444;
    border-radius: 10px;
    cursor: grab;
}
.full { background: cyan !important; }

/* POINTS */
#points {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 40px;
    font-weight: bold;
}

/* ALERT */
#alert {
    position: fixed;
    top: 50%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: red;
    display: none;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="well">💧</div>
<div id="bucket"></div>
<div id="points">0</div>
<div id="alert">🌪️ TAP FAST TO PROTECT!</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("plantGame")) || {
    growth: 0,
    points: 0
};

function save(){
    localStorage.setItem("plantGame", JSON.stringify(data));
}

// ===== BUCKET =====
let bucket = document.getElementById("bucket");
let isFull = false;

document.getElementById("well").onclick = ()=>{
    isFull = true;
    bucket.classList.add("full");
};

bucket.draggable = true;

bucket.addEventListener("dragend", e=>{
    let plantX = canvas.width/2;

    if(Math.abs(e.clientX-plantX)<120 && isFull){
        data.growth += 0.002;
        data.points += 1;

        reaction = 20;

        save();

        isFull = false;
        bucket.classList.remove("full");
    }
});

// ===== RAIN =====
let raining = false;
setInterval(()=>{
    raining = Math.random()<0.4;
}, 6000);

// ===== CYCLONE =====
let cyclone = false;
let tapPower = 0;

setInterval(()=>{
    if(Math.random()<0.25){
        cyclone = true;
        tapPower = 0;
        document.getElementById("alert").style.display = "block";
    }
}, 10000);

// TAP DEFENSE
canvas.addEventListener("click", ()=>{
    if(cyclone){
        tapPower += 1;
    }
});

// ===== DRAW =====
let reaction = 0;

function drawPlant(){
    let x = canvas.width/2;
    let y = canvas.height-80;

    let h = data.growth * 500;

    ctx.strokeStyle = cyclone ? "red" : "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(let i=0;i<h;i+=5){
        let sway = Math.sin(i*0.05 + Date.now()*0.005)*10;
        if(cyclone) sway *= 5;
        ctx.lineTo(x+sway, y-i);
    }
    ctx.stroke();

    // LEAVES
    for(let i=60;i<h;i+=70){
        ctx.fillStyle="green";
        ctx.beginPath();
        ctx.ellipse(x+20,y-i,10,5,0,0,Math.PI*2);
        ctx.fill();
    }

    // REACTION
    if(reaction>0){
        ctx.fillStyle="rgba(0,255,0,0.2)";
        ctx.beginPath();
        ctx.arc(x,y-h,50,0,Math.PI*2);
        ctx.fill();
        reaction--;
    }

    // FRUITS
    if(data.growth>=1) drawFruits(x,y-h);
}

// ===== RAIN DRAW =====
let rainDrops=[];

function drawRain(){
    if(raining){
        rainDrops.push({
            x: Math.random()*canvas.width,
            y:0,
            speed:5+Math.random()*5
        });
    }

    rainDrops.forEach((r,i)=>{
        ctx.fillStyle="cyan";
        ctx.fillRect(r.x,r.y,2,10);
        r.y+=r.speed;

        if(r.y>canvas.height-100){
            data.growth+=0.0005;
            rainDrops.splice(i,1);
        }
    });
}

// ===== CYCLONE LOGIC =====
function handleCyclone(){
    if(!cyclone) return;

    if(tapPower>30){
        cyclone=false;
        document.getElementById("alert").style.display="none";
    } else {
        // DAMAGE
        data.growth -= 0.002;
        if(data.growth <= 0){
            alert("Plant destroyed 💀 Restarting...");
            data.growth = 0;
            data.points = 0;
        }
    }
}

// ===== FRUITS =====
let secretFruit = Math.floor(Math.random()*5);

function drawFruits(x,y){
    for(let i=0;i<5;i++){
        let fx = x + Math.cos(i*1.2)*70;
        let fy = y - Math.sin(i*1.2)*40;

        ctx.fillStyle="red";
        ctx.beginPath();
        ctx.arc(fx,fy,12,0,Math.PI*2);
        ctx.fill();

        canvas.onclick = e=>{
            let dx=e.clientX-fx;
            let dy=e.clientY-fy;

            if(Math.sqrt(dx*dx+dy*dy)<15){
                if(i===secretFruit){
                    window.location.href="secret.html";
                } else {
                    alert("Nothing here...");
                }
            }
        };
    }
}

// ===== LOOP =====
function loop(){
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawPlant();
    drawRain();
    handleCyclone();

    document.getElementById("points").innerText = Math.floor(data.points);

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
