<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growing Plant Game</title>

<style>
body {
    margin: 0;
    background: linear-gradient(#0a0a0a, #1c1c1c);
    overflow: hidden;
    font-family: sans-serif;
    color: white;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
}

button {
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
}

#water {
    position: fixed;
    left: 20px;
    bottom: 100px;
    width: 50px;
    height: 50px;
    background: cyan;
    border-radius: 10px;
    cursor: grab;
}

#well {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: #333;
    border-radius: 50%;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="well"></div>
<div id="water" draggable="true"></div>

<div id="ui">
    <button onclick="saveProgress()">💾 Save</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let plant = {
    growth: 0,
    wateredToday: false
};

let today = new Date();
let targetDate = new Date(today.getFullYear(), 11, 25); // Dec 25

// LOAD
let saved = JSON.parse(localStorage.getItem("plantGame"));
if (saved) plant = saved;

// CALCULATE GROWTH BASED ON DATE
function calculateGrowth() {
    let start = new Date(today.getFullYear(), 0, 1);
    let totalDays = (targetDate - start) / (1000*60*60*24);
    let currentDays = (today - start) / (1000*60*60*24);

    let baseGrowth = currentDays / totalDays;
    plant.growth = Math.max(plant.growth, baseGrowth);
}

calculateGrowth();

// WIND EFFECT
let wind = 0;
setInterval(() => {
    wind = (Math.random() - 0.5) * 0.5;
}, 2000);

// DRAW PLANT
function drawPlant() {
    let baseX = canvas.width / 2;
    let baseY = canvas.height - 100;

    let height = plant.growth * 300;

    ctx.strokeStyle = "lime";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(baseX, baseY);

    // stem with wind sway
    for (let i = 0; i < height; i += 5) {
        let sway = Math.sin(i * 0.05 + Date.now() * 0.002) * 10 + wind * 50;
        ctx.lineTo(baseX + sway, baseY - i);
    }

    ctx.stroke();

    // leaves
    for (let i = 50; i < height; i += 50) {
        ctx.fillStyle = "green";
        ctx.beginPath();
        ctx.ellipse(baseX + 20, baseY - i, 10, 5, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // FULLY GROWN → FRUITS
    if (plant.growth >= 1) {
        drawFruits(baseX, baseY - height);
    }
}

// FRUITS
function drawFruits(x, y) {
    for (let i = 0; i < 5; i++) {
        let fx = x + Math.cos(i) * 50;
        let fy = y - Math.sin(i) * 30;

        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(fx, fy, 10, 0, Math.PI*2);
        ctx.fill();
    }
}

// CLICK FRUIT → SECRET
canvas.addEventListener("click", e => {
    if (plant.growth >= 1) {
        alert("🎁 Secret Unlocked!\n\nYou stayed consistent.\nReward: /secret.html");
    }
});

// WATER DRAG
const water = document.getElementById("water");

water.addEventListener("dragend", e => {
    let plantAreaX = canvas.width / 2;

    if (Math.abs(e.clientX - plantAreaX) < 100) {
        if (!plant.wateredToday) {
            plant.growth += 0.01;
            plant.wateredToday = true;
        }
    }
});

// SAVE
function saveProgress() {
    localStorage.setItem("plantGame", JSON.stringify(plant));
}

// LOOP
function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawPlant();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
